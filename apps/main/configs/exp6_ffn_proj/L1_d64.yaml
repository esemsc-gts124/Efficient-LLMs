
dump_dir: /rds/general/user/gts124/home/Efficient-LLMs/checkpoints/ffn_output/d_emb_64
name: "d_emb_64"
steps: 10000
probe_freq: 2000
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 0.000001
    clip: 10.0

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 232
    D_emb: 64
    n_layers: 4
    n_heads: 4

data:
    # root_dir: /rds/general/user/gts124/ephemeral/fw_edu_10b_data/fineweb_edu_10bt_shuffled
    # sources:
    #     fineweb_edu_10bt: 1.0
    root_dir: /rds/general/user/gts124/ephemeral/redownload_fwedu_10b_data
    sources:
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 16
    prefetch_size: 64
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer: 
        path: /rds/general/user/gts124/home/Efficient-LLMs/llama3_tokenizer 
        name: bytes

profiling:
    run: true

checkpoint:
    dump:
        every: 2000
        keep: 1
    eval:
        every: 11000
        keep: 10

logging:
    freq: 500
    wandb:
        project: ffn_output_tests
        entity: gts124-imperial-college-london
        name: d_emb_64

eval:
    generator:
        max_tokens: 8192
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 1000
