# Template config, need to change dump_dir, data.root_dir and data.tokenizer.path

# 40M PARAMETER MODEL

dump_dir: /rds/general/user/gts124/home/Efficient-LLMs/checkpoints/high_vocab
name: "high_vocab"
steps: 100000
probe_freq: 2000
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 0.000001
    clip: 10.0

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 256 # Lower embedding dimension for high vocabulary test
    n_layers: 17
    n_heads: 8

data:
    # root_dir: /rds/general/user/gts124/ephemeral/fw_edu_10b_data/fineweb_edu_10bt_shuffled
    root_dir: /rds/general/user/gts124/ephemeral/fw_edu_10b_data/fineweb_edu_10bt_shuffled
    sources:
        # dclm_baseline_1.0: 1.0
        fineweb_edu_10bt: 1.0
    batch_size: 16
    prefetch_size: 64
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer: 
        path: /rds/general/user/gts124/home/Efficient-LLMs/llama3_tokenizer # High vocab size
        name: bytes

profiling:
    run: true

checkpoint:
    dump:
        every: 2000
        keep: 1
    eval:
        every: 2000
        keep: 1

logging:
    freq: 10

eval:
    generator:
        max_tokens: 8192
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100
