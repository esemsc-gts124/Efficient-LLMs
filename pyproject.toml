[project]
name = "eval-harness"
version = "0.1.0"
description = "LM-Evaluation-Harness integration for Efficient-LLMs checkpoints"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lm-eval>=0.4.0",
    "omegaconf>=2.3.0",
    "sentencepiece>=0.2.0",
    "torch==2.5.0",
    "tqdm>=4.67.1",
    "xformers>=0.0.28.post2",
    "tiktoken>=0.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
xformers = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
