# NOTE TO SANAE - THE NUMBER OF STEPS HERE IS CONFIGURED TO REACH 10B TOKENS ON 8 GPU'S


dump_dir: /scratch_dgxl/gts124/RDS/home/Efficient-LLMs/final_checkpoints/layerwise/100M_cyclerev_layerwise
name: "100M_cyclerev_layerwise"
steps: 38150
probe_freq: null
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 0.000001
    clip: 10.0

distributed:
    fsdp_type: no_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 320
    ffn_dim_multiplier: 1.125
    ffn_dim: 1024
    n_layers: 12
    n_heads: 8
    rank: 0
    weight_tying: False
    layer_groups: [[0, 11], [1, 10], [2, 9], [3, 8], [4, 7], [5, 6]]
    lora_rank: 0

data:
    root_dir: /scratch_dgxl/gts124/RDS/home/fwedu_10bt
    sources:
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 16
    prefetch_size: 32
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer: 
        path: /scratch_dgxl/gts124/RDS/home/Efficient-LLMs/llama3_tokenizer/original/tokenizer.model
        name: tiktoken

profiling:
    run: true

checkpoint:
    dump:
        every: 7630
        keep: 1
    eval:
        every: 763
        keep: 50

logging:
    freq: 100
    wandb:
        project: MSc_Results
        entity: gts124-imperial-college-london
        name: 100M_cyclerev_layerwise

eval:
    validation:
        max_steps: 1000


