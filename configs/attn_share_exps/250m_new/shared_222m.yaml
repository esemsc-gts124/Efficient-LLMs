dump_dir: /checkpoint/optim/sanaelotfi/weight_shared_llms/checkpoints/final_runs/attn_sharing/250m_exps/222m_shared.yaml
name: Shared_222m
steps: 42000
probe_freq: 5000
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 1.0
    clip: 10.0
distributed:
    fsdp_type: no_shard
    dp_shard: 1
    dp_replicate: 8
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
model:
    dim: 1024
    ffn_dim_multiplier: 1.125
    n_layers: 20
    n_heads: 16
    n_kv_heads: 8
    attn_sharing: true
    head_sharing: true
    qkv_sharing: null
    grouping: 1
    rank: 80
    two_step: false
data:
    root_dir: /checkpoint/optim/sanaelotfi/data
    sources:
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 16
    prefetch_size: 32
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer:
        name: sp
        path: /checkpoint/optim/sanaelotfi/tokenizers/llama2_tokenizer/tokenizer.model
profiling:
    run: true
checkpoint:
    dump:
        every: 4200
        keep: 1
    eval:
        every: 840
        keep: 1
logging:
    freq: 500
    wandb:
        project: icml-experiments
        entity: weight-sharing
        name: Shared_222m
eval:
    validation:
        max_steps: 1000
