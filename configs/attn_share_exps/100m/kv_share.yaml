dump_dir: /net/projects2/interp/efficient_llms_dumps/kv_0
name: KV_Sharing_100m
steps: 42000
probe_freq: 5000
seed: 777
optim:
    lr: 3e-4
    warmup: 2000
    lr_min_ratio: 1.0
    clip: 10.0
distributed:
    fsdp_type: no_shard
    dp_shard: 1
    dp_replicate: 8
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
model:
    dim: 768
    ffn_dim_multiplier: 1.125
    n_layers: 14
    n_heads: 16
    n_kv_heads: 8
    attn_sharing: true
    head_sharing: false
    qkv_sharing:
        - - k
          - v
        - - q
    grouping: 1
    rank: 8
    two_step: false
data:
    root_dir: /net/projects2/interp/Efficient-LLMs/data_8gpu
    sources:
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 16
    prefetch_size: 32
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer:
        name: sp
        path: /net/projects2/interp/Efficient-LLMs/tokenizer/llama2/tokenizer.model
profiling:
    run: false
checkpoint:
    dump:
        every: 4200
        keep: 1
logging:
    freq: 500
    wandb:
        project: 40m_baseline
        entity: muchanem
        name: 40M_DDP_run_0
eval: null
